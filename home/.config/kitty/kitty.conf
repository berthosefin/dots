# kitty config — matugen themed

include themes/Matugen.conf

# Font
font_family      JetBrainsMono Nerd Font
font_size        8.0

# Cursor trail
cursor_trail           3
cursor_trail_decay     0.1 0.4

# Padding
window_padding_width   10

# Window size
initial_window_width   97c
initial_window_height  22c
remember_window_size   no

